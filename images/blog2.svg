<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- Background -->
  <rect width="150" height="150" rx="8" fill="#0f172a"/>
  <!-- CPU chip -->
  <rect x="45" y="45" width="60" height="60" rx="4" fill="#1e40af" stroke="#3b82f6" stroke-width="2"/>
  <rect x="55" y="55" width="40" height="40" rx="2" fill="#1d4ed8"/>
  <!-- Chip label -->
  <text x="75" y="79" font-family="monospace" font-size="10" fill="#93c5fd" text-anchor="middle">CPU</text>
  <text x="75" y="91" font-family="monospace" font-size="7" fill="#60a5fa" text-anchor="middle">X86-64</text>
  <!-- Left pins -->
  <line x1="20" y1="60" x2="45" y2="60" stroke="#3b82f6" stroke-width="2"/>
  <line x1="20" y1="72" x2="45" y2="72" stroke="#3b82f6" stroke-width="2"/>
  <line x1="20" y1="84" x2="45" y2="84" stroke="#3b82f6" stroke-width="2"/>
  <!-- Right pins -->
  <line x1="105" y1="60" x2="130" y2="60" stroke="#3b82f6" stroke-width="2"/>
  <line x1="105" y1="72" x2="130" y2="72" stroke="#3b82f6" stroke-width="2"/>
  <line x1="105" y1="84" x2="130" y2="84" stroke="#3b82f6" stroke-width="2"/>
  <!-- Top pins -->
  <line x1="62" y1="20" x2="62" y2="45" stroke="#3b82f6" stroke-width="2"/>
  <line x1="75" y1="20" x2="75" y2="45" stroke="#3b82f6" stroke-width="2"/>
  <line x1="88" y1="20" x2="88" y2="45" stroke="#3b82f6" stroke-width="2"/>
  <!-- Bottom pins -->
  <line x1="62" y1="105" x2="62" y2="130" stroke="#3b82f6" stroke-width="2"/>
  <line x1="75" y1="105" x2="75" y2="130" stroke="#3b82f6" stroke-width="2"/>
  <line x1="88" y1="105" x2="88" y2="130" stroke="#3b82f6" stroke-width="2"/>
  <!-- Pin dots -->
  <circle cx="20" cy="60" r="3" fill="#60a5fa"/>
  <circle cx="20" cy="72" r="3" fill="#60a5fa"/>
  <circle cx="20" cy="84" r="3" fill="#60a5fa"/>
  <circle cx="130" cy="60" r="3" fill="#60a5fa"/>
  <circle cx="130" cy="72" r="3" fill="#60a5fa"/>
  <circle cx="130" cy="84" r="3" fill="#60a5fa"/>
</svg>
