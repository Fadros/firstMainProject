<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="0 0 150 150">
  <!-- Background -->
  <rect width="150" height="150" rx="8" fill="#1e1e2e"/>
  <!-- Terminal bar -->
  <rect x="0" y="0" width="150" height="28" rx="8" fill="#313244"/>
  <rect x="0" y="14" width="150" height="14" fill="#313244"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="14" r="5" fill="#f38ba8"/>
  <circle cx="36" cy="14" r="5" fill="#f9e2af"/>
  <circle cx="52" cy="14" r="5" fill="#a6e3a1"/>
  <!-- Code lines -->
  <text x="12" y="52" font-family="monospace" font-size="11" fill="#89b4fa">function</text>
  <text x="80" y="52" font-family="monospace" font-size="11" fill="#cdd6f4">hello() {</text>
  <text x="20" y="70" font-family="monospace" font-size="11" fill="#a6e3a1">  return</text>
  <text x="72" y="70" font-family="monospace" font-size="11" fill="#f9e2af">"world"</text>
  <text x="12" y="88" font-family="monospace" font-size="11" fill="#cdd6f4">}</text>
  <!-- Cursor -->
  <rect x="12" y="100" width="8" height="13" fill="#89b4fa" opacity="0.8"/>
  <!-- Bottom decorative line -->
  <line x1="12" y1="128" x2="100" y2="128" stroke="#45475a" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="140" x2="70" y2="140" stroke="#45475a" stroke-width="2" stroke-linecap="round"/>
</svg>
